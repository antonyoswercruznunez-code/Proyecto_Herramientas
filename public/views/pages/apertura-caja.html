<div class="page-header">
  <div class="page-header-left">
    <h2><i class="ti ti-lock-open"></i> Apertura de caja</h2>
    <p>Selecciona una caja libre e ingresa tu PIN de cajero. Las cajas fuera de horario se muestran bloqueadas.</p>
  </div>
</div>

<div id="apertura-mensaje"></div>

<div id="apertura-disponibles">

  <div class="apertura-contenedor">

    <div class="apertura-top">
      <div class="apertura-info">
        <div class="apertura-icono">
          <i class="ti ti-cash"></i>
        </div>

        <div>
          <h4>Cajas habilitadas</h4>
          <p id="apertura-sucursal"></p>
        </div>
      </div>

      <div class="apertura-controles">

        <div id="apertura-selector-global" class="apertura-selector">
          <label class="cfg-lbl" for="apertura-sucursal-select">
            Sucursal a operar
          </label>

          <select id="apertura-sucursal-select" class="form-control"></select>
        </div>

        <div class="apertura-estado">
          <i class="ti ti-circle-check"></i>
          <span>Solo cajas libres</span>
        </div>

      </div>
    </div>

  </div>

  <div id="apertura-cajas" class="apertura-grid"></div>

</div>


<div id="modal-apertura-caja" class="apertura-overlay">

  <div class="apertura-modal">

    <div class="apertura-modal-header">

      <div class="apertura-modal-titulo">

        <div class="apertura-modal-icono">
          <i class="ti ti-lock-open"></i>
        </div>

        <div>
          <h3>
            Abrir <span id="apertura-caja-nombre">caja</span>
          </h3>

          <p>
            Confirma tu identidad con tu PIN de cajero.
          </p>
        </div>

      </div>

      <button
        class="apertura-cerrar"
        id="btn-cancelar-apertura"
        title="Cerrar"
      >
        <i class="ti ti-x"></i>
      </button>

    </div>


    <div class="apertura-modal-body">

      <div class="apertura-campo">

        <label
          class="cfg-lbl"
          id="apertura-credencial-label"
        >
          PIN de cajero *
        </label>

        <div class="apertura-input">
          <i class="ti ti-key"></i>

          <input
            id="apertura-pin"
            type="password"
            inputmode="numeric"
            autocomplete="current-password"
            maxlength="6"
            class="form-control"
            placeholder="Ingresa tu PIN"
          >
        </div>

      </div>


      <div class="apertura-fondo">

        <div class="apertura-fondo-icono">
          <i class="ti ti-wallet"></i>
        </div>

        <div class="apertura-fondo-info">

          <label class="cfg-lbl">
            Fondo inicial configurado
          </label>

          <strong id="apertura-monto">
            S/ 0.00
          </strong>

          <p>
            El administrador configura este monto para esta caja.
          </p>

        </div>

      </div>


      <div class="apertura-campo">

        <label class="cfg-lbl">
          Observación <span>(opcional)</span>
        </label>

        <textarea
          id="apertura-observacion"
          class="form-control"
          placeholder="Ej. Fondo entregado por administración"
        ></textarea>

      </div>

    </div>


    <div class="apertura-modal-footer">

      <button
        class="btn btn-outline"
        id="btn-cancelar-apertura-2"
      >
        Cancelar
      </button>

      <button
        class="btn btn-primary apertura-btn-confirmar"
        id="btn-confirmar-apertura"
      >
        <i class="ti ti-lock-open"></i>
        Abrir caja
      </button>

    </div>

  </div>

</div>
